# Tests on GPU back-ends. Draft pull requests skip them, unless selected by name in the last commit message: `[only cuda]`
# or `[only tests]` for all of them. `[skip amdgpu]` or `[skip tests]` does the opposite.

steps:
  - label: "CUDA - Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      #- JuliaCI/julia-test#v1: ~
    command: julia --eval='println("Skipping CUDA tests - pipeline configured to do nothing")'
    agents:
      queue: "cuda"
    env:
      WITH_CUDA_TESTS: "true"
      WITH_CPU_TESTS: "false"
    # if: |
    #   build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
    #   (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
    #    build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
